plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

def env = System.getenv()
def tag = providers.environmentVariable('TAG')
version = tag.orElse("${mod_version}-development").get()
group = mod_group

base {
    archivesName = mod_archive_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    withJavadocJar()
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// Opt-in integration tests run in a separate server and stay out of release JARs.
if (providers.gradleProperty('gameTests').isPresent()) {
    sourceSets.create('gameTest') {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    configurations.gameTestImplementation.extendsFrom configurations.implementation
    configurations.gameTestRuntimeOnly.extendsFrom configurations.runtimeOnly
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = file('run')
        }
        client {
            client()
            if (providers.gradleProperty('clientSmoke').isPresent()) {
                systemProperty 'electricadvantage.clientSmoke', 'true'
                gameDirectory = file('build/client-smoke')
            }
        }
        if (providers.gradleProperty('gameTests').isPresent()) {
            gameTestServer {
                type = 'gameTestServer'
                gameDirectory = file('build/gametest-run')
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (providers.gradleProperty('gameTests').isPresent()) sourceSet(sourceSets.gameTest)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content {
            includeGroup 'zone.moddev.mc.orespawn'
            includeGroup 'zone.moddev.mc.lib'
            includeGroup 'zone.moddev.mc.poweradvantage'
        }
    }
}

dependencies {
    implementation "zone.moddev.mc.lib:mmdlib:${mmdlib_version}"
    implementation "zone.moddev.mc.poweradvantage:PowerAdvantage:${poweradvantage_version}"
    implementation "zone.moddev.mc.orespawn:OreSpawn:${orespawn_version}"
}

tasks.named('processResources', ProcessResources) {
    def properties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            curseforge_url: "https://www.curseforge.com/projects/${curseforge_id}",
            issue_url: issue_url,
            update_url: update_url
    ]
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar) {
    manifest.attributes('Implementation-Version': project.version)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = mod_archive_name
            from components.java
        }
    }
    repositories {
        if (env.MAVEN_UPLOAD_URL) {
            maven {
                url = uri(env.MAVEN_UPLOAD_URL)
                credentials {
                    username = env.MAVEN_UPLOAD_USERNAME
                    password = env.MAVEN_UPLOAD_PASSWORD
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
    }
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}
